name: Neon Pink Profile Animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate animated butterfly heatmap and tech stack
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > build.py <<'PY'
          import json, math, os, urllib.request

          COLORS = ["#2a1228", "#7a0a72", "#b00da6", "#e30fd6", "#ff10f0"]
          STEP, CELL, PAD = 15, 12, 20


          def fetch_weeks(user, token):
              query = """query($login:String!){user(login:$login){contributionsCollection{
              contributionCalendar{weeks{contributionDays{contributionCount weekday}}}}}}"""
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": {"login": user}}).encode(),
                  headers={"Authorization": "bearer " + token,
                           "Content-Type": "application/json",
                           "User-Agent": "butterfly-heatmap"})
              data = json.load(urllib.request.urlopen(req))
              return data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]


          def build(weeks):
              peak = max((d["contributionCount"] for w in weeks for d in w["contributionDays"]), default=0) or 1
              w_px = len(weeks) * STEP + PAD * 2
              h_px = 7 * STEP + PAD * 2
              cells = []
              for x, week in enumerate(weeks):
                  for day in week["contributionDays"]:
                      c = day["contributionCount"]
                      lvl = 0 if c == 0 else min(4, math.ceil(4 * c / peak))
                      cells.append(
                          f'<rect class="c" x="{PAD + x * STEP}" y="{PAD + day["weekday"] * STEP}" '
                          f'width="{CELL}" height="{CELL}" rx="2" fill="{COLORS[lvl]}" '
                          f'style="animation-delay:{(x % 12) * 0.25:.2f}s"/>')
              path = (f"M{PAD+10},{h_px*0.35:.0f} C{w_px*0.18:.0f},{PAD-18} {w_px*0.30:.0f},{h_px*0.95:.0f} {w_px*0.45:.0f},{h_px*0.5:.0f} "
                      f"S{w_px*0.65:.0f},{PAD-18} {w_px*0.78:.0f},{h_px*0.7:.0f} S{w_px-PAD:.0f},{h_px*0.9:.0f} {w_px-PAD-10:.0f},{h_px*0.4:.0f} "
                      f"C{w_px*0.8:.0f},{h_px+10:.0f} {w_px*0.55:.0f},{h_px*0.85:.0f} {w_px*0.38:.0f},{h_px*0.3:.0f} "
                      f"S{w_px*0.12:.0f},{h_px*0.6:.0f} {PAD+10},{h_px*0.35:.0f} Z")
              wing = ('<path d="M2,-1 C6,-18 24,-18 19,-3 Z" fill="#ff10f0" stroke="#fff" stroke-width=".8"/>'
                      '<path d="M2,1 C6,13 17,15 14,3 Z" fill="#ff2e97" stroke="#fff" stroke-width=".8"/>'
                      '<circle cx="13" cy="-8" r="2.2" fill="#fff" opacity=".85"/>')
              flap = ('<animateTransform attributeName="transform" type="scale" values="1 1;0.2 1;1 1" '
                      'dur="0.45s" repeatCount="indefinite"/>')
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{w_px}" height="{h_px}" viewBox="0 0 {w_px} {h_px}">
          <style>.c{{animation:s 3s ease-in-out infinite}}@keyframes s{{50%{{opacity:.55}}}}@media (prefers-reduced-motion:reduce){{.c{{animation:none}}}}</style>
          <defs><filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <rect width="{w_px}" height="{h_px}" rx="10" fill="#0d0d0d"/>
          {"".join(cells)}
          <g filter="url(#g)"><animateMotion dur="16s" repeatCount="indefinite" path="{path}"/>
          <g transform="scale(1.15)"><g>{flap}{wing}</g><g transform="scale(-1,1)"><g>{flap}{wing}</g></g>
          <ellipse cx="0" cy="0" rx="1.8" ry="7" fill="#fff"/><path d="M0,-6 Q-4,-12 -6,-12 M0,-6 Q4,-12 6,-12" stroke="#fff" stroke-width=".8" fill="none"/></g></g>
          </svg>'''


          def tech_stack():
              items = ["Java", "SQLite", "Python", "HTML5", "CSS", "GitHub", "Maven"]
              x, pills = 0, []
              for t in items:
                  w = len(t) * 10 + 34
                  pills.append(f'<g transform="translate({x},10)"><rect class="p" width="{w}" height="40" rx="20"/>'
                               f'<circle class="d" cx="20" cy="20" r="5"/><text class="t" x="34" y="26">{t}</text></g>')
                  x += w + 14
              return f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="60" viewBox="0 0 800 60">
          <style>.p{{fill:#0d0d0d;stroke:#ff10f0;stroke-width:2;filter:url(#g)}}.t{{fill:#fff;font:700 15px Verdana,Arial,sans-serif}}.d{{fill:#ff10f0}}</style>
          <defs><filter id="g" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="#0d0d0d"/><stop offset=".08" stop-color="#0d0d0d" stop-opacity="0"/><stop offset=".92" stop-color="#0d0d0d" stop-opacity="0"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
          <g id="r">{"".join(pills)}</g></defs>
          <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-{x} 0" dur="22s" repeatCount="indefinite"/>
          <use xlink:href="#r"/><use xlink:href="#r" x="{x}"/><use xlink:href="#r" x="{2*x}"/></g>
          <rect width="800" height="60" fill="url(#f)"/></svg>'''


          if __name__ == "__main__":
              os.makedirs("dist", exist_ok=True)
              weeks = fetch_weeks(os.environ["GH_USER"], os.environ["GH_TOKEN"])
              with open("dist/github-butterfly.svg", "w", encoding="utf-8") as f:
                  f.write(build(weeks))
              with open("dist/tech-stack.svg", "w", encoding="utf-8") as f:
                  f.write(tech_stack())

          PY
          python3 build.py

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
